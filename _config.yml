title: Aatu Alatalo Portfolio
url: "https://aatualatalo.com"
baseurl: ""
description: "Official portfolio of Aatu Alatalo — photographer from Oulu, Finland, and Hasselblad Masters 2026 finalist in the Project//21 category. One of ten global Project//21 finalists alongside category winner Panitbhand Paribatra Na Ayudhya. Fine art, portrait and street photography."

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock
  - "._*"
  - "**/._*"
  - ".DS_Store"
  - context.md
  - llms.txt
  - llms-full.txt
  - scripts/
  - venv
  - .github
  - Node_modules
