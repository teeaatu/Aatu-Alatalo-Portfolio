<!DOCTYPE html>
{% assign lang = page.lang | default: 'fi' %}
<html lang="{{ lang }}">
<head>
  {% include head.html %}
  <!-- Zoom disable for iOS Safari, and ensure 100vw doesn't overflow -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Custom fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap" rel="stylesheet">
  
  <style>
    /* Prevent sideways scrolling */
    html, body {
      touch-action: pan-y;
      overflow-x: hidden !important;
      max-width: 100vw;
    }
    
    /* Override style.css sidebar margin for desktop */
    #jd-main {
      margin-left: 0 !important;
      width: 100% !important;
      max-width: 100vw !important;
    }

    /* ─── JD BASE RESET ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --jd-bg:       #f5f4f0;
      --jd-text:     #1a1a18;
      --jd-dimmed:   #888880;
      --jd-accent:   #1a1a18;
      --jd-font:     'Helvetica Neue', Helvetica, Arial, sans-serif;
      --jd-font-serif: 'Lora', Georgia, serif;
      --jd-panel-w:  50vw;    /* Valikko on täsmälleen puolet ruudusta työpöydällä */
    }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
      background: var(--jd-bg);
      color: var(--jd-text);
      font-family: var(--jd-font);
      overflow: hidden; /* Slideshow ei skrollaudu */
    }
    
    /* Erittäin hienovarainen kohinatekstuuri koko sivuston yllä (ei häiritse käyttöä) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── HEADER ──────────────────────────────────────── */
    #jd-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.4rem 1.8rem;
      pointer-events: none;
    }

    .jd-header-left, .jd-header-right {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .jd-ui-btn {
      background: none;
      border: none;
      color: var(--jd-text);
      font-family: var(--jd-font);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      opacity: 1;
      mix-blend-mode: normal;
    }
    .jd-ui-link {
      color: var(--jd-text);
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 1;
    }

    /* ─── TACTILE FEEDBACK (APPLE STYLE) ────────────────────────── */
    .jd-ui-btn, .jd-ui-link, .jd-bottom-btn, .jd-index-link {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease !important;
      will-change: transform, opacity;
      transform: scale(1);
    }
    .jd-bottom-btn, .jd-ui-btn, .jd-ui-link {
      display: inline-block;
      transform-origin: center;
    }
    .jd-index-link {
      transform-origin: left center; /* Estää tekstin siirtymisen sivulle skaalattaessa */
    }
    .jd-ui-btn:active, 
    .jd-ui-link:active, 
    .jd-bottom-btn:active, 
    .jd-index-link:active {
      transform: scale(0.985) !important;
      opacity: 0.6 !important;
      transition: transform 0.05s ease, opacity 0.05s ease !important;
    }

    /* ─── MAIN CONTENT AREA ─────────────────────────── */
    #jd-main {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
    }

    /* ─── INDEX PANEL ────────────────────────────────── */
    #jd-index-panel {
      position: fixed !important;
      top: 100% !important; left: 0; right: 0;
      width: 100%;
      height: 100dvh !important;
      background: rgba(245, 244, 240, 0.82);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      backdrop-filter: saturate(180%) blur(24px);
      color: var(--jd-text);
      z-index: 500;
      padding: 4rem 2.5rem 2.5rem;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      cursor: auto;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(0);
    }
    /* Fallback selaimille, jotka eivät tue backdrop-filteriä */
    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      #jd-index-panel {
        background: var(--jd-bg);
      }
    }
    #jd-index-panel.is-open {
      transform: translateY(-100%);
    }

    /* Ylikirjoitetaan paneelin tekstien värit vaaleiksi */
    #jd-index-panel a, #jd-index-panel div, #jd-index-panel span {
      color: var(--jd-text) !important;
    }

    /* Tummentaa gallerian taustaa indeksin alla */
    #jd-index-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 490;
      background: rgba(0, 0, 0, 0);
      opacity: 0;
      pointer-events: none;
      transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.01s;
    }
    #jd-index-overlay.is-open {
      background: rgba(0, 0, 0, 0);
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      /* Peittää koko ruudun valikon vasemmalla puolella */
      width: calc(100vw - var(--jd-panel-w));
    }





    /* ─── THUMBS VIEW ────────────────────────────────── */
    #jd-thumbs-panel {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--jd-bg);
      z-index: 300;
      overflow-y: auto;
      padding: 4rem 1.5rem 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #jd-thumbs-panel.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ─── MOBILE (<768px) ────────────────────────────── */
    @media (max-width: 768px) {
      :root { --jd-panel-w: 100%; }
      #jd-header { padding: 1rem 1.2rem; }
      #jd-index-overlay.is-open { width: 100%; }
      
      /* Poistetaan hover/parallax -hyppy puhelimella koskettaessa */
      #jd-index-panel.is-open.parallax-ready:hover {
        transform: translateY(-100%) !important;
      }
    }
  </style>
</head>
<body ontouchstart="">


  <!-- Pääsisältö (Slideshow tai muu sivu) -->
  <main id="jd-main">
    {{ content }}
  </main>

  <!-- Index-paneeli -->
  {% include index-panel.html %}

  <!-- Overlay paneelin taustaksi -->
  <div id="jd-index-overlay"></div>

  <!-- About-paneeli -->
  {% include about-panel.html %}

  <script>
    // ── Index-paneeli — avaus/sulkeminen ──────────────
    const indexPanel  = document.getElementById('jd-index-panel');
    const indexOverlay = document.getElementById('jd-index-overlay');
    const jdMain      = document.getElementById('jd-main');



    window.openIndexPanel = function() {
      if (indexPanel) {
        indexPanel.style.transition = '';
        indexPanel.style.transform = '';
        indexPanel.classList.add('is-open');
      }
      indexOverlay?.classList.add('is-open');
      document.body.classList.add('index-is-open');
      
      if (indexPanel) indexPanel.scrollTop = 0;
    };
    window.closeIndexPanel = function() {
      if (indexPanel) {
        indexPanel.style.transition = '';
        indexPanel.style.transform = '';
        indexPanel.classList.remove('parallax-ready');
        indexPanel.classList.remove('is-open');
      }
      indexOverlay?.classList.remove('is-open');
      document.body.classList.remove('index-is-open');
    };

    // ── Swipe-to-Close logiikka (Index Panel) ──────────────
    if (indexPanel) {
      let panelTouchStartY = 0;
      let isDraggingPanel = false;

      indexPanel.addEventListener('touchstart', (e) => {
        if (indexPanel.scrollTop <= 0) {
          panelTouchStartY = e.touches[0].clientY;
          isDraggingPanel = true;
          indexPanel.style.transition = 'none'; // Poista CSS-siirtymä seuraamisen ajaksi
        } else {
          isDraggingPanel = false;
        }
      }, { passive: true });

      indexPanel.addEventListener('touchmove', (e) => {
        if (!isDraggingPanel) return;
        const dy = e.touches[0].clientY - panelTouchStartY;
        if (dy > 0) {
          // Vetää alaspäin
          indexPanel.style.transform = `translateY(calc(-100% + ${dy}px))`;
          if (e.cancelable) e.preventDefault(); // Estää sivun natiivin overscrollin
        } else {
          // Vetää ylöspäin yli reunan
          indexPanel.style.transform = `translateY(-100%)`;
        }
      }, { passive: false });

      indexPanel.addEventListener('touchend', (e) => {
        if (!isDraggingPanel) return;
        isDraggingPanel = false;
        const dy = e.changedTouches[0].clientY - panelTouchStartY;
        
        if (dy > 120) {
          // Vedettiin tarpeeksi alas -> sulje valikko
          window.closeIndexPanel();
        } else {
          // Ei vedetty tarpeeksi -> palauta täysin auki
          indexPanel.style.transition = '';
          indexPanel.style.transform = ''; // Palauttaa CSS-luokan määrittämän translateY(-100%)
        }
      }, { passive: true });
    }

    window.openAboutPanel = function() {
      const aboutPanel = document.getElementById('jd-about-panel');
      if (aboutPanel) {
        aboutPanel.classList.add('is-open');
        document.body.classList.add('about-is-open');
        // Piilota gallery bottom nav, jotta se ei näy about paneelin alta
        const jdNormalNav = document.getElementById('jd-normal-nav');
        if (jdNormalNav) jdNormalNav.style.display = 'none';
      }
    };

    window.closeAboutPanel = function() {
      const aboutPanel = document.getElementById('jd-about-panel');
      if (aboutPanel) {
        aboutPanel.classList.remove('is-open');
        document.body.classList.remove('about-is-open');
        // Palauta gallery bottom nav, jos ei olla thumbs-tilassa
        const jdNormalNav = document.getElementById('jd-normal-nav');
        const thumbsPanel = document.getElementById('jd-thumbs-panel');
        if (jdNormalNav && (!thumbsPanel || !thumbsPanel.classList.contains('is-open'))) {
          jdNormalNav.style.display = 'flex';
        }
      }
    };

    // Sulje klikkaamalla tummaa galleria-aluetta
    indexOverlay?.addEventListener('click', (e) => {
      window.closeIndexPanel();
    });

    // Klikkaus suoraan jd-main:iin (fallback jos overlay ei reagoi)
    jdMain?.addEventListener('click', (e) => {
      // Jos klikkaus tulee alapalkin napeista, älä tee mitään
      if (e.target.closest('#jd-bottom-nav')) return;
      
      if (document.body.classList.contains('index-is-open')) {
        window.closeIndexPanel();
      }
    });

    // Sulje nykyinen kategoria-linkki klikkaamalla (sama sivu)
    document.querySelectorAll('#jd-index-panel .jd-index-link.active').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        window.closeIndexPanel();
      });
    });

    // Sulje Escape-näppäimellä
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        window.closeIndexPanel();
        window.closeAboutPanel();
      }
    });

  </script>
</body>
</html>
